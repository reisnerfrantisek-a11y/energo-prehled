<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Aktualizace Energo Přehled</title>
  <style>
    :root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#07101d;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    main{width:min(480px,100%);padding:28px;border:1px solid #1d2a3c;border-radius:24px;background:#0d1726;text-align:center}h1{font-size:24px;margin:0 0 12px}p{color:#a8b4c7;line-height:1.5}.spinner{width:34px;height:34px;border:4px solid #24354d;border-top-color:#4c9cff;border-radius:50%;margin:22px auto;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}button{border:0;border-radius:14px;padding:12px 16px;background:#4c9cff;color:white;font:inherit;font-weight:750}
  </style>
</head>
<body>
<main>
  <h1>Aktualizuji aplikaci</h1>
  <div class="spinner" id="spinner"></div>
  <p id="status">Odstraňuji pouze cache aplikace. Importovaná data a ceny faktur zůstávají zachované.</p>
  <button id="retry" hidden>Zkusit znovu</button>
</main>
<script>
async function refreshApp(){
  const status=document.getElementById('status'),retry=document.getElementById('retry'),spinner=document.getElementById('spinner');
  retry.hidden=true;spinner.hidden=false;
  try{
    const base=new URL('./',location.href).href;
    status.textContent='Odpojuji starou verzi aplikace…';
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope===base).map(r=>r.unregister()));
    }
    status.textContent='Čistím pouze beta cache…';
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('energo-prehled-beta-')||k==='energo-prehled-v1.1.0').map(k=>caches.delete(k)));
    }
    status.textContent='Načítám nejnovější verzi…';
    const target=new URL('./',location.href);target.searchParams.set('fresh',Date.now().toString());
    setTimeout(()=>location.replace(target.href),250);
  }catch(e){
    console.error(e);spinner.hidden=true;retry.hidden=false;
    status.textContent='Aktualizace se nepodařila: '+e.message;
  }
}
document.getElementById('retry').onclick=refreshApp;
refreshApp();
</script>
</body>
</html>

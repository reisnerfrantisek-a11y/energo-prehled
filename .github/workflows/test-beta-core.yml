name: Beta regression tests

on:
  push:
    branches: [main, 'refactor/**', 'fix/**', 'feature/**']
    paths:
      - 'beta/**'
      - '.github/workflows/test-beta-core.yml'
  pull_request:
    paths:
      - 'beta/**'
      - '.github/workflows/test-beta-core.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run beta regression suite
        run: node --test beta/tests/*.test.cjs
